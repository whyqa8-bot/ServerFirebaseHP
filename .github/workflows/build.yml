name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cari proyek (ekstrak ZIP bila perlu)
        id: find
        run: |
          set -e
          # Kalau ada file ZIP di root repo, ekstrak ke folder terpisah
          for z in ./*.zip; do
            [ -f "$z" ] || continue
            echo "Ekstrak $z"
            mkdir -p _unzipped
            unzip -o -q "$z" -d _unzipped
          done
          # Cari folder yang berisi settings.gradle (paling dangkal dulu)
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle tidak ditemukan di repository. Upload semua isi proyek PhoneBase (atau file ZIP-nya) ke repository."
            echo "Isi repository:"; ls -la; find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proyek ditemukan di: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebase-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
